name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/terminal/package-lock.json

      # pyproject.toml force-includes frontend/terminal/dist into the wheel, and
      # that directory is a gitignored build artifact. Without it `uv sync` dies
      # with "Forced include not found", so build the bundle before resolving.
      - name: Build TUI bundle
        working-directory: frontend/terminal
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run test suite
        run: uv run pytest -q

  # Windows is a first-class target: shell selection, hook argument quoting and
  # subprocess spawning all behave differently there, and every regression in
  # those areas is invisible to a Linux-only matrix.
  python-tests-windows:
    name: Python tests (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/terminal/package-lock.json

      # pyproject.toml force-includes frontend/terminal/dist into the wheel, and
      # that directory is a gitignored build artifact. Without it `uv sync` dies
      # with "Forced include not found", so build the bundle before resolving.
      - name: Build TUI bundle
        working-directory: frontend/terminal
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run test suite
        run: uv run pytest -q

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/terminal/package-lock.json

      # pyproject.toml force-includes frontend/terminal/dist into the wheel, and
      # that directory is a gitignored build artifact. Without it `uv sync` dies
      # with "Forced include not found", so build the bundle before resolving.
      - name: Build TUI bundle
        working-directory: frontend/terminal
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Quality ratchet
        run: uv run python scripts/quality_gate.py

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/terminal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/terminal/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
