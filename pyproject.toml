[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openharness-ai"
dynamic = ["version"]
description = "Shim — open-source AI coding assistant CLI (formerly OpenHarness)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "novix-science" },
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "mcp>=1.0.0,<2",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "questionary>=2.0.1",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
# Chat-channel integrations are optional: the CLI and engine never import
# them, and ChannelManager loads each implementation on demand.
channels = [
    "slack-sdk>=3.0.0",
    "python-telegram-bot>=21.0.0",
    "lark-oapi>=1.5.0",
    "qq-botpy>=1.2.0",
]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
# External benchmark adapters (`python -m benchmarks.run --suite humaneval`).
benchmark = [
    "human-eval>=1.0.3",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
shim = "openharness.cli:app"
openharness = "openharness.cli:app"
oh = "openharness.cli:app"
openh = "openharness.cli:app"
ohmo = "ohmo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openharness", "ohmo"]

[tool.hatch.version]
path = "src/openharness/version.py"

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.openharness-venv",
    "/.openharness",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
]

[tool.hatch.build.targets.wheel.force-include]
"frontend/terminal/package.json" = "openharness/_frontend/package.json"
"frontend/terminal/dist" = "openharness/_frontend/dist"

[tool.hatch.build.targets.sdist]
artifacts = [
    "/frontend/terminal/dist",
]
include = [
    "/src/openharness",
    "/ohmo",
    "/frontend/terminal/package.json",
    "/frontend/terminal/dist",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Typer evaluates `typer.Option(...)` in the signature by design: the call is
# how the CLI declares a flag, not a mutable default.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# Boundary adapters translate arbitrary SDK/network/process failures into
# user-visible errors or best-effort cleanup. Core modules are not exempted
# here; their broad catches are narrowed or annotated individually.
"src/openharness/channels/**" = ["BLE001"]
"src/openharness/autopilot/**" = ["BLE001"]
"src/openharness/auth/external.py" = ["BLE001"]
"src/openharness/auth/storage.py" = ["BLE001"]
"src/openharness/auth/manager.py" = ["BLE001"]
"src/openharness/auth/flows.py" = ["BLE001"]
"src/openharness/services/cron_scheduler.py" = ["BLE001"]
"src/openharness/mcp/client.py" = ["BLE001"]
"src/openharness/plugins/loader.py" = ["BLE001"]
"src/openharness/themes/loader.py" = ["BLE001"]
"src/openharness/hooks/executor.py" = ["BLE001"]
"src/openharness/swarm/**" = ["BLE001"]
"src/openharness/tools/agent_tool.py" = ["BLE001"]
"src/openharness/tools/send_message_tool.py" = ["BLE001"]
"src/openharness/tools/mcp_auth_tool.py" = ["BLE001"]
"src/openharness/ui/react_launcher.py" = ["BLE001"]
"tests/**" = ["BLE001"]
"scripts/**" = ["BLE001"]
# Compatibility re-exports: swarm workers, third-party callers and tests import
# these names from ``engine.query`` even though the implementations moved.
"src/openharness/engine/query.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
